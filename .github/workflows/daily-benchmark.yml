name: Daily scraping API benchmark

on:
  schedule:
    - cron: '47 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Refresh benchmark
        run: python3 probe_scraping_apis.py
      - name: Commit refreshed artifacts
        run: |
          git add data.json README.md index.html
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: refresh scraping API benchmark'
            git push
          fi
